# .NET 빌드·회귀 테스트와 production 파일럿의 정적 진단을 검사한다.
name: dotnet-tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "feature/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # build → test 분리: dotnet test --no-incremental은 .slnx에서 MSB1001 (SDK 10.0.203+)
      # .editorconfig의 pilot SA1201/SA1202/IDE0011 error도 이 빌드에서 실패시킨다.
      - name: Build and enforce pilot diagnostics
        run: dotnet build Dawnholder.slnx --no-incremental

      - name: Test
        run: dotnet test Dawnholder.slnx --no-build --logger "console;verbosity=normal"
