name: code-rules

on:
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: File collection scope (same tools and rules)
        type: choice
        options: [Changed, All]
        default: All
      base:
        description: Git base for a manual run
        type: string
        default: origin/main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RULES_SCOPE: ${{ github.event_name == 'pull_request' && 'Changed' || inputs.scope }}
      RULES_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base }}
    steps:
      # GITHUB_ENV applies to later steps, including evidence steps after checkout/setup failure.
      - name: Initialize job-local paths
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'RULES_OUTPUT=%s\n' "$RUNNER_TEMP/code-rules-results"
            printf 'RULES_MODULES=%s\n' "$RUNNER_TEMP/code-rules-tools/modules"
            printf 'NPM_CONFIG_CACHE=%s\n' "$RUNNER_TEMP/code-rules-tools/npm"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare evidence and verify checkout
        shell: bash
        env:
          EXPECTED_CHECKOUT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RULES_OUTPUT/setup" "$RULES_MODULES"
          git rev-parse HEAD > "$RULES_OUTPUT/setup/head.txt"
          test "$(git rev-parse HEAD)" = "$EXPECTED_CHECKOUT"
          git rev-parse --verify --end-of-options "$RULES_BASE^{commit}" > "$RULES_OUTPUT/setup/base.txt"
          node --version > "$RULES_OUTPUT/setup/node-version.txt"
          python3 --version > "$RULES_OUTPUT/setup/python-version.txt"

      - name: Save exact analyzer in job-local cache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rulesLog = Join-Path $env:RULES_OUTPUT 'setup/pssa-install.txt'
          'Save-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Repository PSGallery -Path RULES_MODULES' |
              Set-Content -LiteralPath $rulesLog
          try {
              Save-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Repository PSGallery `
                  -Path $env:RULES_MODULES *>> $rulesLog
          } catch {
              $_ | Out-String | Add-Content -LiteralPath $rulesLog
              throw
          }

      - name: Restore existing Management lockfile without installation scripts
        shell: bash
        working-directory: 05_Management/frontend
        run: |
          set -euo pipefail
          printf '%s\n' 'npm ci --ignore-scripts --no-audit --no-fund' > "$RULES_OUTPUT/setup/npm-command.txt"
          node --version > "$RULES_OUTPUT/setup/npm-node-version.txt"
          npm --version > "$RULES_OUTPUT/setup/npm-version.txt"
          set +e
          npm ci --ignore-scripts --no-audit --no-fund > "$RULES_OUTPUT/setup/npm.stdout.txt" 2> "$RULES_OUTPUT/setup/npm.stderr.txt"
          npm_exit=$?
          set -e
          printf '%s\n' "$npm_exit" > "$RULES_OUTPUT/setup/npm-exit.txt"
          exit "$npm_exit"

      - name: Report npm engine warnings
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const setup = path.join(process.env.RULES_OUTPUT, 'setup');
          function readSetup(name) {
            try {
              return fs.readFileSync(path.join(setup, name), 'utf8');
            } catch (error) {
              if (error.code === 'ENOENT') return null;
              throw error;
            }
          }
          const nodeVersion = readSetup('npm-node-version.txt')?.trim() || 'not recorded';
          const npmVersion = readSetup('npm-version.txt')?.trim() || 'not recorded';
          const npmExit = readSetup('npm-exit.txt')?.trim() || null;
          const logs = ['npm.stdout.txt', 'npm.stderr.txt'].map(readSetup);
          const warnings = logs.flatMap(log => (log ?? '').split(/\r?\n/)
            .filter(line => /^npm warn EBADENGINE\b/i.test(line)));
          const observation = warnings.length
            ? 'Observed npm EBADENGINE warnings; warnings do not change the install exit.'
            : npmExit === null || logs.includes(null)
              ? 'Not fully observed: installation exit or captured logs are missing (skipped or interrupted).'
              : 'No npm EBADENGINE warnings observed in captured installation output.';
          const details = [
            `Node: ${nodeVersion}`,
            `npm: ${npmVersion}`,
            `npm ci exit: ${npmExit ?? 'not recorded (skipped or interrupted)'}`,
            '', observation,
            ...(warnings.length ? ['', 'Captured npm EBADENGINE lines:', ...warnings] : []),
          ].join('\n');
          // A fence longer than the captured text keeps npm output inside a Markdown code block.
          let fenceLength = 3;
          for (const ticks of details.matchAll(/`+/g)) {
            fenceLength = Math.max(fenceLength, ticks[0].length + 1);
          }
          const fence = '`'.repeat(fenceLength);
          const summary = `### Management npm engines\n\n${fence}text\n${details}\n${fence}\n`;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary, 'utf8');
          if (warnings.length) {
            // Only an escaped annotation is printed; raw logs remain in the existing artifact.
            const message = warnings.join('\n').replace(/%/g, '%25')
              .replace(/\r/g, '%0D').replace(/\n/g, '%0A');
            process.stdout.write(`::warning title=npm EBADENGINE::${message}\n`);
          }
          NODE

      # SQL installation and lint remain deferred until the SQL modules split is complete,
      # followed by a new modules/verify-schema applicability pilot and an adoption decision.
      - name: Check selected worktree inputs
        if: always()
        shell: bash
        run: |
          mkdir -p "$RULES_OUTPUT/checker"
          set +e
          node 99_Tools/CodeRules/check-code-rules.mjs \
            --scope "$RULES_SCOPE" --base "$RULES_BASE" \
            --output "$RULES_OUTPUT" \
            --pssa-manifest "$RULES_MODULES/PSScriptAnalyzer/1.25.0/PSScriptAnalyzer.psd1" \
            > "$RULES_OUTPUT/checker/stdout.txt" 2> "$RULES_OUTPUT/checker/stderr.txt"
          rules_exit=$?
          printf '%s\n' "$rules_exit" > "$RULES_OUTPUT/checker/exit.txt"
          cat "$RULES_OUTPUT/checker/stdout.txt" "$RULES_OUTPUT/checker/stderr.txt"
          exit "$rules_exit"

      # Independently authored tests have separate ownership; absence/load failure is an error.
      - name: Run independent checker regressions
        if: always()
        shell: bash
        env:
          CODE_RULES_PSSA_MANIFEST: ${{ runner.temp }}/code-rules-tools/modules/PSScriptAnalyzer/1.25.0/PSScriptAnalyzer.psd1
          CODE_RULES_RESULTS: ${{ runner.temp }}/code-rules-results/independent-tests
        run: |
          set -euo pipefail
          mkdir -p "$CODE_RULES_RESULTS"
          if ! test -f 99_Tools/CodeRules.Tests/code-rules.test.mjs; then
            printf '%s\n' 'Independent test entry point is missing: 99_Tools/CodeRules.Tests/code-rules.test.mjs' \
              > "$CODE_RULES_RESULTS/stderr.txt"
            exit 1
          fi
          node --test 99_Tools/CodeRules.Tests/code-rules.test.mjs \
            > "$CODE_RULES_RESULTS/stdout.txt" 2> "$CODE_RULES_RESULTS/stderr.txt"

      - name: Run independent Orca message policy regressions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          orca_results="$RULES_OUTPUT/orca-independent-tests"
          mkdir -p "$orca_results"
          printf '%s\n' 'node --test 99_Tools/Orca.Tests/message-policy.test.mjs' > "$orca_results/command.txt"
          set +e
          if test -f 99_Tools/Orca.Tests/message-policy.test.mjs; then
            node --test 99_Tools/Orca.Tests/message-policy.test.mjs \
              > "$orca_results/stdout.txt" 2> "$orca_results/stderr.txt"
            orca_exit=$?
          else
            : > "$orca_results/stdout.txt"
            printf '%s\n' 'Independent test entry point is missing: 99_Tools/Orca.Tests/message-policy.test.mjs' \
              > "$orca_results/stderr.txt"
            orca_exit=1
          fi
          printf '%s\n' "$orca_exit" > "$orca_results/exit.txt"
          cat "$orca_results/stdout.txt" "$orca_results/stderr.txt"
          exit "$orca_exit"

      - name: Run independent MergeGate regressions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          merge_gate_results="$RULES_OUTPUT/merge-gate-independent-tests"
          mkdir -p "$merge_gate_results"
          printf '%s\n' 'node --test 99_Tools/MergeGate.Tests/*.test.mjs' > "$merge_gate_results/command.txt"
          shopt -s nullglob
          merge_gate_tests=(99_Tools/MergeGate.Tests/*.test.mjs)
          set +e
          if test "${#merge_gate_tests[@]}" -gt 0; then
            node --test "${merge_gate_tests[@]}" \
              > "$merge_gate_results/stdout.txt" 2> "$merge_gate_results/stderr.txt"
            merge_gate_exit=$?
          else
            : > "$merge_gate_results/stdout.txt"
            printf '%s\n' 'Independent test suite is missing: 99_Tools/MergeGate.Tests/*.test.mjs' \
              > "$merge_gate_results/stderr.txt"
            merge_gate_exit=1
          fi
          printf '%s\n' "$merge_gate_exit" > "$merge_gate_results/exit.txt"
          cat "$merge_gate_results/stdout.txt" "$merge_gate_results/stderr.txt"
          exit "$merge_gate_exit"

      - name: Run independent Backlog candidate regressions
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          backlog_results="$RULES_OUTPUT/backlog-independent-tests"
          mkdir -p "$backlog_results"
          printf '%s\n' 'node --test 99_Tools/Backlog.Tests/*.test.mjs' > "$backlog_results/command.txt"
          shopt -s nullglob
          backlog_tests=(99_Tools/Backlog.Tests/*.test.mjs)
          set +e
          if test "${#backlog_tests[@]}" -gt 0; then
            node --test "${backlog_tests[@]}" \
              > "$backlog_results/stdout.txt" 2> "$backlog_results/stderr.txt"
            backlog_exit=$?
          else
            : > "$backlog_results/stdout.txt"
            printf '%s\n' 'Independent test suite is missing: 99_Tools/Backlog.Tests/*.test.mjs' \
              > "$backlog_results/stderr.txt"
            backlog_exit=1
          fi
          printf '%s\n' "$backlog_exit" > "$backlog_results/exit.txt"
          cat "$backlog_results/stdout.txt" "$backlog_results/stderr.txt"
          exit "$backlog_exit"

      - name: Preserve results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-rules-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/code-rules-results/
          if-no-files-found: error
          retention-days: 14
